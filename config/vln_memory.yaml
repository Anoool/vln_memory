# 当前 camera_record 的离线构建配置。先填写录包、输出目录和地图信息。
dataset:
  bag_path: /absolute/path/to/camera_record
  memory_dir: /absolute/path/to/new_memory
  map_id: site_s4
  geometry_revision: recorded-v1
  map_basis: Recorded map and TF

topics:
  rgb: /camera/color/image_raw/compressed
  depth: /camera/depth/image_raw/compressedDepth
  rgb_camera_info: /camera/color/camera_info
  depth_camera_info: /camera/depth/camera_info
  tf: /tf
  tf_static: /tf_static

frames:
  map: map
  body: base_link
  rgb_optical: camera_color_optical_frame
  depth_optical: camera_color_optical_frame

preprocess:
  sync_tolerance_ms: 30
  depth_scale_to_m: 0.001
  keyframe_distance_m: 0.8
  keyframe_yaw_deg: 25

geometry:
  near_dimension: xy
  near_threshold_m: 1.5

build:
  observations_per_batch: 4
  max_tool_rounds: 12
  resume: true

model:
  base_url: http://127.0.0.1:8000/v1
  model: local-vlm
  api_key_file: api_key.yaml  # 路径相对于本配置；在本地文件填写密钥。
  timeout_s: 60
